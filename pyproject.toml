[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-cctv"
version = "1.0.0"
description = "Offline CCTV evidence verification research console"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "opencv-python-headless>=4.10,<5", "pillow>=10,<13", "pyyaml>=6,<7", "matplotlib>=3.8,<4", "pandas>=2.2,<4", "pyarrow>=16"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "types-PyYAML", "pre-commit"]
research = ["torch>=2.5,<3", "transformers>=4.51,<5", "accelerate>=1", "tensorboard>=2", "safetensors>=0.4", "lm-format-enforcer>=0.10"]
cloud = ["bitsandbytes>=0.45; sys_platform == 'linux'"]
docs = ["mkdocs-material>=9", "python-docx>=1.1", "python-pptx>=1", "reportlab>=4"]
gradio = ["gradio>=5,<7"]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
